[theme]
primaryColor = "#4CAF50"
backgroundColor = "#F0F7F4"
secondaryBackgroundColor = "#E8F5E9"
textColor = "#2E4057"
font = "sans serif"

[server]
headless = true
port = 8501
maxUploadSize = 5
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false
serverAddress = "localhost"
serverPort = 8501

[runner]
magicEnabled = false
fastReruns = true

[client]
showErrorDetails = false
toolbarMode = "minimal"
